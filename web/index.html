<script>
    function generatePassword(length = 12) {
        const lowercase = "abcdefghijklmnopqrstuvwxyz";
        const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const numbers = "0123456789";
        const symbols = "!@#$%^&*()_+";

        // Гарантируем, что в пароле будет хотя бы один символ каждого типа
        const requiredChars = [
            lowercase[Math.floor(Math.random() * lowercase.length)],
            uppercase[Math.floor(Math.random() * uppercase.length)],
            numbers[Math.floor(Math.random() * numbers.length)],
            symbols[Math.floor(Math.random() * symbols.length)]
        ];

        // Объединяем все наборы для заполнения оставшейся длины
        const allChars = lowercase + uppercase + numbers + symbols;
        const remainingLength = length - requiredChars.length;

        const randomChars = [];
        for (let i = 0; i < remainingLength; i++) {
            const randomIndex = Math.floor(Math.random() * allChars.length);
            randomChars.push(allChars[randomIndex]);
        }

        // Объединяем обязательные и случайные символы, а затем перемешиваем их (алгоритм Фишера-Йетса)
        const passwordArray = [...requiredChars, ...randomChars];
        for (let i = passwordArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [passwordArray[i], passwordArray[j]] = [passwordArray[j], passwordArray[i]];
        }

        document.getElementById("password").textContent = passwordArray.join('');
    }

    async function copyPassword() {
        const password = document.getElementById("password").textContent;

        if (password === 'Нажмите "Сгенерировать"') {
            showToast("Сначала сгенерируйте пароль");
            return;
        }

        try {
            await navigator.clipboard.writeText(password);
            showToast("Пароль скопирован!");
        } catch (err) {
            showToast("Не удалось скопировать пароль");
        }
    }

    function showToast(message) {
        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 2000);
    }
</script>
